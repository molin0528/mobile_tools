<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#673AB7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="编辑记录">
    <meta name="application-name" content="编辑记录">
    <meta name="format-detection" content="telephone=no">
    <title>编辑记录</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head><body>
    <div class="app-bar">
        <span class="app-bar-back" onclick="location.href='records.html'"></span>
        <span class="app-bar-title" id="pageTitle">编辑记录</span>
    </div>

    <div class="container">
        <div class="card">
            <div class="form-group">
                <label class="form-label" for="editDate">日期</label>
                <input class="form-control" id="editDate" type="date">
            </div>
            <div class="form-group">
                <label class="form-label" for="editHours">时长(小时)</label>
                <input class="form-control" id="editHours" type="number" step="0.5" value="10" placeholder="请输入工作时长">
            </div>
            <div class="form-group">
                <label class="form-label" for="editSalary">薪资(元)</label>
                <input class="form-control" id="editSalary" type="number" value="250" placeholder="请输入薪资金额">
            </div>
            <div class="form-row">
                <button class="btn-cancel" onclick="location.href='records.html'">取消</button>
                <button class="btn-save" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>
<script>
var defaultData=[{id:1,date:'2026-11-15',hours:8,salary:400},{id:2,date:'2026-11-16',hours:8.5,salary:425},{id:3,date:'2026-11-17',hours:7.5,salary:375},{id:4,date:'2026-11-18',hours:8,salary:400},{id:5,date:'2026-11-19',hours:9,salary:450}];

function norm(r){if(!r)return r;if(r.date===undefined&&r.d!==undefined){r.date=r.d;delete r.d}if(r.hours===undefined&&r.h!==undefined){r.hours=r.h;delete r.h}if(r.salary===undefined&&r.s!==undefined){r.salary=r.s;delete r.s}return r;}
function loadData(){var stored=localStorage.getItem('attendanceData');if(stored){try{return JSON.parse(stored).map(norm)}catch(e){}}return defaultData.map(norm).slice()}
function saveData(data){localStorage.setItem('attendanceData',JSON.stringify(data))}
var r=loadData();
var params=new URLSearchParams(location.search);
var idParam=params.get('id');
var editId=-1;
if(idParam!==null&&idParam!==''){
  var id=parseInt(idParam);
  if(!isNaN(id)){
    editId=id;
    var rec=null;
    for(var i=0;i<r.length;i++){if(r[i].id===id){rec=r[i];break}}
    if(rec){
      document.getElementById('pageTitle').textContent='编辑记录';
      document.getElementById('editDate').value=rec.date;
      document.getElementById('editHours').value=rec.hours;
      document.getElementById('editSalary').value=rec.salary;
    }else{
      document.getElementById('pageTitle').textContent='添加记录';
      editId=-1;
      document.getElementById('editHours').value=10;
      document.getElementById('editSalary').value=250;
    }
  }
}else{
  document.getElementById('pageTitle').textContent='添加记录';
  document.getElementById('editHours').value=10;
  document.getElementById('editSalary').value=250;
}
function saveEdit(){var date=document.getElementById('editDate').value;var hours=parseFloat(document.getElementById('editHours').value);var salary=parseFloat(document.getElementById('editSalary').value);if(!date||isNaN(hours)||isNaN(salary)){alert('请填写完整信息');return}if(editId===-1){var newId=r.length?Math.max.apply(null,r.map(function(x){return x.id}))+1:1;r.push({id:newId,d:date,h:hours,s:salary})}else{var rec=null;for(var i=0;i<r.length;i++){if(r[i].id===editId){rec=r[i];break}}if(rec){rec.date=date;rec.hours=hours;rec.salary=salary}}saveData(r);location.href='records.html'}
</script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js', {scope: './'})
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.log('SW register failed:', err));
            });
        }
    </script>
</body></html>
