<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#673AB7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="考勤统计">
    <meta name="application-name" content="考勤统计">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-TileColor" content="#673AB7">
    <title>考勤统计 - 安卓版</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-bar">
        <span class="app-bar-title">考勤统计</span>
    </div>
    <div class="container">
        <div class="card">
            <div class="card-title">本月统计</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="workDays">0</div>
                    <div class="stat-label">工作天数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalHours">0h</div>
                    <div class="stat-label">总时长</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalSalary">0元</div>
                    <div class="stat-label">总薪资</div>
                </div>
            </div>
            <button class="btn-primary" onclick="location.href='records.html'" style="margin-top:10px;">编辑记录</button>
        </div>
        <div class="card">
            <div class="card-title">考勤日历</div>
            <div class="cal-wrap">
                <div class="cal-nav">
                    <button onclick="shiftCal(-1)">◀</button>
                    <span id="monthLabel" style="font-weight:600;"></span>
                    <button onclick="shiftCal(1)">▶</button>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <div class="stats-grid" style="margin-top:10px;">
                    <div class="stat-card stat-red">
                        <div class="stat-value" id="restDays">0</div>
                        <div class="stat-label">已休息天数</div>
                    </div>
                    <div class="stat-card stat-green">
                        <div class="stat-value" id="monthWorkDays">0</div>
                        <div class="stat-label">已工作天数</div>
                    </div>
                    <div class="stat-card stat-blue">
                        <div class="stat-value" id="remainingDays">0</div>
                        <div class="stat-label">距离月底还剩</div>
                    </div>
                </div>
            </div>
        <div class="card">
            <div class="card-title">数据备份</div>
            <div style="display:flex; gap:8px; justify-content:center; padding:10px;">
                <button class="btn-primary btn-inline" onclick="exportData()">导出数据</button>
                <button class="btn-secondary btn-inline" onclick="document.getElementById('importFile').click()">导入数据</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            </div>
            <div style="font-size:12px; color:#757575; text-align:center; padding:8px;">
                导出为 JSON 文件，可在其他设备导入恢复
            </div>
        </div>
    </div>
    <script>
        const defaultRecords = [
            {id:1,date:'2026-11-15',hours:8,salary:400,status:'正常',remark:'正常考勤'},
            {id:2,date:'2026-11-16',hours:8.5,salary:425,status:'加班',remark:'加班半小时'},
            {id:3,date:'2026-11-17',hours:7.5,salary:375,status:'早退',remark:'早退1小时'},
            {id:4,date:'2026-11-18',hours:8,salary:400,status:'正常',remark:'正常考勤'},
            {id:5,date:'2026-11-19',hours:9,salary:450,status:'加班',remark:'全天加班'}        ];
        
function norm(r){if(!r)return r;if(r.date===undefined&&r.d!==undefined){r.date=r.d;delete r.d}if(r.hours===undefined&&r.h!==undefined){r.hours=r.h;delete r.h}if(r.salary===undefined&&r.s!==undefined){r.salary=r.s;delete r.s}return r;}
function loadRecords() {
            const stored = localStorage.getItem('attendanceData');
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    return data.map(norm).map(r => ({id:r.id, date:r.date, hours:r.hours, salary:r.salary, status:'正常', remark:''}));
                } catch(e) {}
            }
            return defaultRecords.slice();
        }
        function getCurrentMonthRecords(records) {
            const now = new Date();
            return records.filter(function(x) {
                const d = new Date(x.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
        }
        const allRecords = loadRecords();
        const records = getCurrentMonthRecords(allRecords);
        const totalHours = records.reduce((s,r) => s + r.hours, 0);
        document.getElementById('workDays').textContent = records.length;
        document.getElementById('totalHours').textContent = totalHours.toFixed(1) + 'h';
        document.getElementById('totalSalary').textContent = records.reduce((s,r) => s + r.salary, 0) + '元';
        const now2 = new Date();
        const totalDays = new Date(now2.getFullYear(), now2.getMonth() + 1, 0).getDate();
        const elapsedDays = now2.getDate();
        const restDays = Math.max(0, elapsedDays - records.length);
        const remainingDays = Math.max(0, totalDays - elapsedDays);
        document.getElementById('restDays').textContent = restDays + '/' + Math.max(0, totalDays - 26);
        document.getElementById('monthWorkDays').textContent = records.length;
        document.getElementById('remainingDays').textContent = remainingDays;

        function exportData(){
            var data = localStorage.getItem('attendanceData');
            if(!data){alert('暂无数据可导出');return}
            var blob = new Blob([data], {type:'application/json'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'attendance_'+new Date().toISOString().slice(0,10)+'.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        function importData(evt){
            var file = evt.target.files[0];
            if(!file)return;
            var reader = new FileReader();
            reader.onload = function(e){
                try{
                    var json = JSON.parse(e.target.result);
                    if(!Array.isArray(json)){throw new Error('数据格式错误')}
                    localStorage.setItem('attendanceData', JSON.stringify(json));
                    alert('导入成功，共 '+json.length+' 条记录');
                    location.reload();
                }catch(err){
                    alert('导入失败：'+err.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
    <script>
        function loadCalData(){var s=localStorage.getItem('attendanceData');if(s){try{return JSON.parse(s).map(norm)}catch(e){}}return [{id:1,date:'2026-11-15',hours:8,salary:400},{id:2,date:'2026-11-16',hours:8.5,salary:425},{id:3,date:'2026-11-17',hours:7.5,salary:375},{id:4,date:'2026-11-18',hours:8,salary:400},{id:5,date:'2026-11-19',hours:9,salary:450}]}
        var calData=loadCalData();
        var calCur=new Date();
        function shiftCal(n){calCur.setMonth(calCur.getMonth()+n);renderCal();}
        function renderCal(){
            var y=calCur.getFullYear(), m=calCur.getMonth();
            document.getElementById('monthLabel').textContent=y+'年'+(m+1)+'月';
            
            // 计算该月统计数据
            var totalDays=new Date(y,m+1,0).getDate();
            var today=new Date();
            var isCurrentMonth = (y===today.getFullYear() && m===today.getMonth());
            var elapsedDays = isCurrentMonth ? today.getDate() : 
                (y<today.getFullYear() || (y===today.getFullYear() && m<today.getMonth()) ? totalDays : 0);
            
            // 该月有记录的天数
            var monthRecords = calData.filter(function(r){
                var d=new Date(r.date);
                return d.getFullYear()===y && d.getMonth()===m;
            });
            var monthWorkDays = monthRecords.length;
            var monthTotalHours = monthRecords.reduce(function(s,r){return s + r.hours;}, 0);
            var monthTotalSalary = monthRecords.reduce(function(s,r){return s + r.salary;}, 0);
            var restDays = Math.max(0, elapsedDays - monthWorkDays);
            var remainingDays = Math.max(0, totalDays - elapsedDays);
            
            // 同步顶部“本月统计”三栏
            document.getElementById('workDays').textContent = monthWorkDays;
            document.getElementById('totalHours').textContent = monthTotalHours.toFixed(1) + 'h';
            document.getElementById('totalSalary').textContent = monthTotalSalary + '元';
            
            // 同步日历下方三栏
            document.getElementById('restDays').textContent = restDays + '/' + Math.max(0, totalDays - 26);
            document.getElementById('monthWorkDays').textContent = monthWorkDays;
            document.getElementById('remainingDays').textContent = remainingDays;
            
            var grid=document.getElementById('calGrid'); grid.innerHTML='';
            ['日','一','二','三','四','五','六'].forEach(function(h){var c=document.createElement('div');c.className='cal-cell header';c.textContent=h;grid.appendChild(c);});
            var firstDay=new Date(y,m,1).getDay();
            for(var i=0;i<firstDay;i++){var c=document.createElement('div');c.className='cal-cell';grid.appendChild(c);}
            for(var d=1;d<=totalDays;d++){
                var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
                var has=calData.some(function(r){return r.date===ds;});
                var isFuture = (y>today.getFullYear()) || (y===today.getFullYear() && m>today.getMonth()) || (y===today.getFullYear() && m===today.getMonth() && d>today.getDate());
                var isToday = (d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear());
                var c=document.createElement('div'); 
                var bg = has ? '#e8f5e9' : (isFuture ? '#e3f2fd' : '#ffebee');
                c.style.background = bg;
                c.className='cal-cell'+(isToday?' today':'');
                c.textContent=d;
                grid.appendChild(c);
            }
        }
        renderCal();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js', {scope: './'})
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.log('SW register failed:', err));
            });
        }
    </script>
</body>
</html>
